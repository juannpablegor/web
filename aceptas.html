<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Aceptas?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
      background-color: #ffccd5;
    }
    h1 {
      color: #ff3234;
    }
    .options {
      margin-top: 2rem;
    }
    .options button {
      color: white;
      background-color: #fe3334;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 5px;
    }
    .options button:hover {
      background-color: #ff989e;
    }
  </style>
</head>
<body>
  <h1>¿Aceptas ser mi San Valentín?</h1>
  <div class="options">
    <button>¡Sí, acepto!</button>
    <button>No, lo siento.</button>
  </div>
</body>
</html>
